<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
    </style>

    <!-- Cyan glow -->
    <filter id="glow-cyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Magenta glow -->
    <filter id="glow-magenta" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Green glow -->
    <filter id="glow-green" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft overall glow for text -->
    <filter id="glow-text" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for background -->
    <clipPath id="bg-clip">
      <rect width="520" height="140" rx="10"/>
    </clipPath>

    <!-- Gradient for scanlines -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(0,0,0,0.25)"/>
      <rect y="2" width="1" height="2" fill="rgba(0,0,0,0)"/>
    </pattern>

    <!-- Radial glow behind icon -->
    <radialGradient id="icon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal grid lines background texture -->
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00e5ff" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="520" height="140" rx="10" fill="#1a1f2e"/>

  <!-- Subtle grid texture -->
  <rect width="520" height="140" rx="10" fill="url(#grid)" clip-path="url(#bg-clip)"/>

  <!-- Scanline overlay -->
  <rect width="520" height="140" rx="10" fill="url(#scanlines)" clip-path="url(#bg-clip)" opacity="0.4"/>

  <!-- ─── ICON: Hexagonal chip mark ─── -->
  <!-- Centered at (70, 70), flat-top hex, radius 44 -->
  <!-- Hex vertices (flat-top, r=44): 
       right:   (114, 70)
       bot-right:(92, 108.2)
       bot-left: (48, 108.2)
       left:    (26, 70)
       top-left: (48, 31.8)
       top-right:(92, 31.8) -->

  <!-- Glow orb behind hex -->
  <ellipse cx="70" cy="70" rx="55" ry="55" fill="url(#icon-glow)"/>

  <!-- Outer hex (dim, for depth) -->
  <polygon
    points="114,70 92,108.2 48,108.2 26,70 48,31.8 92,31.8"
    fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>

  <!-- Main hex -->
  <polygon
    points="108,70 88,103.9 48,103.9 28,70 48,36.1 88,36.1"
    fill="#1a1f2e" stroke="#00e5ff" stroke-width="2.2"/>

  <!-- Main hex glow duplicate -->
  <polygon
    points="108,70 88,103.9 48,103.9 28,70 48,36.1 88,36.1"
    fill="none" stroke="#00e5ff" stroke-width="2.2" filter="url(#glow-cyan)" opacity="0.9"/>

  <!-- Inner hex ring (chip die) -->
  <polygon
    points="94,70 79,96 51,96 36,70 51,44 79,44"
    fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.35"/>

  <!-- Crosshair inside -->
  <line x1="65" y1="57" x2="65" y2="83" stroke="#00e5ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="53" y1="70" x2="87" y2="70" stroke="#00e5ff" stroke-width="0.6" opacity="0.2"/>

  <!-- ── Circuit traces (IC pin legs) emanating from hex edges ── -->

  <!-- RIGHT edge trace (cyan) -->
  <line x1="108" y1="70" x2="130" y2="70" stroke="#00e5ff" stroke-width="2" opacity="0.85"/>
  <!-- no, that goes into text area — let's trim to ~120 -->
  
  <!-- TOP-RIGHT trace (magenta) -->
  <polyline points="88,36.1 98,20 112,20" 
            fill="none" stroke="#ff0066" stroke-width="1.8" opacity="0.9"/>
  <circle cx="114" cy="20" r="3" fill="#ff0066" filter="url(#glow-magenta)"/>

  <!-- BOT-RIGHT trace (green) -->
  <polyline points="88,103.9 98,120 112,120"
            fill="none" stroke="#69ff47" stroke-width="1.8" opacity="0.9"/>
  <circle cx="114" cy="120" r="3" fill="#69ff47" filter="url(#glow-green)"/>

  <!-- TOP-LEFT trace (green) -->
  <polyline points="48,36.1 32,20 16,20"
            fill="none" stroke="#69ff47" stroke-width="1.8" opacity="0.9"/>
  <circle cx="14" cy="20" r="3" fill="#69ff47" filter="url(#glow-green)"/>

  <!-- BOT-LEFT trace (magenta) -->
  <polyline points="48,103.9 32,120 16,120"
            fill="none" stroke="#ff0066" stroke-width="1.8" opacity="0.9"/>
  <circle cx="14" cy="120" r="3" fill="#ff0066" filter="url(#glow-magenta)"/>

  <!-- LEFT edge trace (cyan, going off left — just a dot at edge) -->
  <line x1="28" y1="70" x2="10" y2="70" stroke="#00e5ff" stroke-width="2" opacity="0.7"/>
  <rect x="6" y="67" width="6" height="6" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>

  <!-- RIGHT edge trace (cyan) -->
  <line x1="108" y1="70" x2="122" y2="70" stroke="#00e5ff" stroke-width="2" opacity="0.7"/>
  <rect x="122" y="67" width="6" height="6" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>

  <!-- ── Terminal prompt symbol inside hex ── -->
  <!-- ">" prompt, glowing cyan -->
  <text x="70" y="80"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="32" font-weight="700"
        text-anchor="middle"
        fill="#00e5ff"
        filter="url(#glow-cyan)">&#x25B8;</text>

  <!-- Cursor bar after ">" -->
  <rect x="83" y="60" width="9" height="20" fill="#00e5ff" opacity="0.85" filter="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ─── WORDMARK ─── -->

  <!-- "cernera" — bold, cyan -->
  <text x="148" y="74"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="38" font-weight="700"
        fill="#00e5ff"
        letter-spacing="2"
        filter="url(#glow-text)">cernera</text>

  <!-- ".me" — smaller, hot magenta, baseline-aligned -->
  <text x="148" y="104"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="22" font-weight="400"
        fill="#ff0066"
        letter-spacing="8"
        filter="url(#glow-magenta)">.me</text>

  <!-- Decorative underline / separator -->
  <line x1="148" y1="112" x2="500" y2="112" stroke="#7b00ff" stroke-width="1" opacity="0.4"/>
  <line x1="148" y1="115" x2="420" y2="115" stroke="#7b00ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Top-right corner decoration (matching top-left hex trace aesthetic) -->
  <polyline points="490,12 510,12 510,32" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.4"/>
  <polyline points="10,128 10,130 30,130" fill="none" stroke="#ff0066" stroke-width="1.2" opacity="0.4" transform="translate(480,0) scale(-1,1)"/>

</svg>
