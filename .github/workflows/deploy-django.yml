name: Build and Deploy Django

on:
  push:
    branches: [develop]
    paths:
      - 'server/**'

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack — build started
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":hammer: *cernera.me API* build started by *${{ github.actor }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  build-and-push:
    runs-on: ubuntu-latest
    needs: notify-start
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Django API image
        uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: cernerae/cernera_me_django_api:latest

      - name: Notify Slack — build result
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *cernera.me API* build *${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory ${{ secrets.DO_DEPLOY_PATH }}
            cd ${{ secrets.DO_DEPLOY_PATH }}
            git pull
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose --env-file .env -f docker/docker-compose.yml pull django
            docker compose --env-file .env -f docker/docker-compose.yml run --rm django python manage.py migrate
            docker compose --env-file .env -f docker/docker-compose.yml up -d django
            docker image prune -f

      - name: Notify Slack — deploy result
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && ':rocket:' || ':x:' }} *cernera.me API* deploy *${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK